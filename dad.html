<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dad — Salesforce + Driving</title>
  <style>
    :root{
      --bg:#0b1220; --text:#e5e7eb; --muted:#9ca3af; --line:rgba(255,255,255,0.10);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1000px 600px at 10% 0%, #1e2a52 0%, var(--bg) 50%, #070b14 100%);
      color: var(--text);
    }
    .wrap{ max-width: 900px; margin: 0 auto; padding: 18px; }
    h1{ margin:0; font-size: 22px; font-weight: 900; }
    .subtitle{ margin-top:6px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    a.btn{
      display:inline-block;
      margin-top: 12px;
      border: 1px solid var(--line);
      background: rgba(15,23,42,0.45);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      text-decoration:none;
      font-weight: 800;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Dad — Salesforce + Driving</h1>
    <div class="subtitle">Tracker page (placeholder). You can paste your existing Dad tracker content here.</div>
    <a class="btn" href="index.html">← Back to Family Plan</a>

</html>
