<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Indfødsretsprøven – Daily Test History</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0b0f14;color:#e7eef7}
    header{padding:18px 14px;max-width:1100px;margin:auto}
    h1{margin:0 0 6px;font-size:18px}
    .muted{color:#8aa0b6;font-size:13px}
    .wrap{max-width:1100px;margin:auto;padding:0 14px 30px}
    .card{background:#121826;border:1px solid #223044;border-radius:14px;padding:12px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .tag{font-size:12px;color:#8aa0b6;border:1px solid #223044;padding:4px 8px;border-radius:999px}
    .btn{display:inline-block;background:#1f2a44;color:#e7eef7;border:1px solid #223044;border-radius:10px;padding:7px 10px;text-decoration:none}
    .btn:hover{filter:brightness(1.1)}
    details summary{cursor:pointer}
    pre{white-space:pre-wrap;background:#0f1624;border:1px solid #223044;border-radius:10px;padding:10px;color:#e7eef7;overflow:auto}
    .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
    input{background:#0f1624;color:#e7eef7;border:1px solid #223044;border-radius:10px;padding:8px 10px}
    .content{margin-top:10px}
  </style>
</head>
<body>
<header>
  <h1>Indfødsretsprøven – Daily Test History</h1>
  <div class="muted">Loads from <code>docs/data.json</code>. Latest day appears first.</div>
</header>

<div class="wrap">
  <div class="topbar">
    <input id="q" placeholder="Search (e.g., 1864, EU, Grundloven)..." size="36" />
    <span class="tag" id="countTag">Loading…</span>
  </div>

  <div id="list"></div>

  <div class="muted" style="margin-top:14px">
    If you only see link emails (no questions), your Apps Script is not fetching the test page yet.
  </div>
</div>

<script>
  let DATA = [];

  async function load() {
    // cache buster so GitHub Pages always fetches latest
    const res = await fetch("./data.json?cache=" + Date.now());
    DATA = await res.json();
    render();
  }

  function esc(s){
    return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function render() {
    const q = (document.getElementById("q").value || "").toLowerCase();
    const filtered = DATA.filter(d => {
      const hay = (d.date + " " + (d.subject||"") + " " + (d.rawText||"")).toLowerCase();
      return !q || hay.includes(q);
    });

    document.getElementById("countTag").textContent = `${filtered.length} day(s)`;
    const list = document.getElementById("list");

    list.innerHTML = "";

    filtered.forEach(d => {
      const card = document.createElement("div");
      card.className = "card";

      const header = document.createElement("div");
      header.className = "row";
      header.innerHTML = `
        <div>
          <strong>${esc(d.date || "")}</strong>
          <span class="tag" style="margin-left:8px">${esc(d.source || "gmail")}</span>
        </div>
        <div class="muted">${esc(d.subject || "")}</div>
      `;

      const controls = document.createElement("div");
      controls.className = "content";
      controls.innerHTML = d.dailyUrl
        ? `<a class="btn" href="${esc(d.dailyUrl)}" target="_blank" rel="noopener">Open original daily test link</a>`
        : "";

      const details = document.createElement("details");
      details.open = true;

      const summary = document.createElement("summary");
      summary.textContent = "Show / hide saved content";
      details.appendChild(summary);

      const content = document.createElement("div");
      content.className = "content";

      // IMPORTANT:
      // If your JSON contains fetched HTML (recommended field: testHtml),
      // render it as HTML using innerHTML.
      // Otherwise show rawText as <pre>.
      const html = d.testHtml || d.html || "";
      if (html && /<\/?[a-z][\s\S]*>/i.test(html)) {
        // Looks like HTML — render it
        content.innerHTML = html;
      } else {
        // Not HTML — show as text
        content.innerHTML = `<pre>${esc(d.rawText || html || "")}</pre>`;
      }

      details.appendChild(content);

      card.appendChild(header);
      card.appendChild(controls);
      card.appendChild(details);
      list.appendChild(card);
    });
  }

  document.getElementById("q").addEventListener("input", render);
  load();
</script>
</body>
</html>
