<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Daily Citizenship Test Links</title>
</head>
<body>
<h2>Daily test links</h2>
<ul id="list"></ul>

<script>
fetch("./data.json?c=" + Date.now())
  .then(r => r.json())
  .then(data => {
    const ul = document.getElementById("list");
    data.forEach(d => {
      const li = document.createElement("li");
      li.innerHTML = `${d.date} — <a href="${d.url}" target="_blank">Open test</a>`;
      ul.appendChild(li);
    });
  });
</script>
</body>
</html>
