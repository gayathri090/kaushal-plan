<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Test – Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,Arial;background:#0b0f14;color:#e7eef7;margin:0;padding:16px}
h1{font-size:20px}
.card{background:#121826;border:1px solid #223044;border-radius:12px;padding:12px;margin:12px 0}
.q{font-weight:600;margin-bottom:6px}
.opt{margin-left:10px}
.correct{color:#7CFC9A;font-weight:600}
.tag{display:inline-block;background:#1f2a44;border:1px solid #223044;border-radius:999px;
     padding:3px 8px;font-size:12px;margin-right:6px;margin-top:6px}
.muted{color:#8aa0b6;font-size:13px}
</style>
</head>
<body>

<h1>Saved Daily Test</h1>
<div class="muted" id="paper"></div>
<div class="muted" id="meta"></div>
<div class="muted" style="margin-top:6px">
  Source: <a id="src" href="#" target="_blank" rel="noopener" style="color:#8fb7ff">open</a>
</div>

<div id="list"></div>

<script>
const params = new URLSearchParams(location.search);
const paperEl = document.getElementById('paper');

const date = params.get("date") || "2025-11-08"; // default

fetch(`./papers/${date}.json`)
  .then(r => r.json())
  .then(data => {
    document.getElementById("meta").textContent = `Date: ${data.date}`;
    const a = document.getElementById("src");
    a.href = data.sourceUrl || "#";

    const list = document.getElementById("list");

    data.questions.forEach(q => {
      const div = document.createElement("div");
      div.className = "card";

      let opts = "";
      for (const k in q.options) {
        const isCorrect = q.correct === k;
        opts += `
          <div class="opt ${isCorrect ? "correct" : ""}">
            ${k}. ${q.options[k].da} ${isCorrect ? " ✔" : ""}
            <div class="muted">${q.options[k].en}</div>
          </div>`;
      }

      const tags = (q.tags || []).map(t =>
        `<span class="tag">${t}</span>`
      ).join("");

      div.innerHTML = `
        <div class="q">${q.no}. ${q.question_da}</div>
        <div class="muted">${q.question_en}</div>
        ${opts}
        <div>${tags}</div>
      `;
      list.appendChild(div);
    });
  })
  .catch(err => {
    document.body.innerHTML = "<h2>Error loading paper</h2><pre>"+err+"</pre>";
  });
</script>

</body>
</html>
