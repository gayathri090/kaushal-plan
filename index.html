<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Planner</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --shadow:0 8px 24px rgba(15,23,42,.08);

      --chip:#f1f5f9;

      --study:#2563eb;
      --meal:#16a34a;
      --move:#7c3aed;
      --sleep:#f59e0b;
      --vit:#dc2626;
      --work:#0ea5e9;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
    }
    header{
      position:sticky; top:0; z-index:10;
      background:linear-gradient(180deg,#0b1220,#0f172a);
      color:white;
      padding:14px 16px;
      box-shadow:0 6px 18px rgba(0,0,0,.2);
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      max-width:1200px; margin:0 auto;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
    }
    .brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.2px}
    .clock{
      font-variant-numeric: tabular-nums;
      padding:8px 10px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:12px;
      background:rgba(255,255,255,.06);
    }

    /* Big icon tabs */
    .tabs-wrap{
      max-width:1200px; margin:14px auto 0;
      padding:0 16px 12px;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .tab{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--card);
      box-shadow:0 6px 18px rgba(15,23,42,.06);
      cursor:pointer;
      user-select:none;
      min-width:180px;
    }
    .tab .icon{font-size:26px; line-height:1}
    .tab .tname{font-weight:800}
    .tab .tsub{font-size:12px; color:var(--muted)}
    .tab.active{
      outline:3px solid rgba(59,130,246,.25);
      border-color:rgba(59,130,246,.35);
    }

    /* Layout same as screenshot: left days, right details */
    .app{
      max-width:1200px; margin:0 auto;
      padding:0 16px 28px;
      display:grid;
      grid-template-columns: 380px 1fr;
      gap:16px;
    }
    @media (max-width: 980px){
      .app{grid-template-columns: 1fr; }
    }

    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .panel-head{
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
    }
    .panel-head h2{
      margin:0;
      font-size:16px;
      letter-spacing:.2px;
    }
    .small{
      color:var(--muted);
      font-size:12px;
    }

    /* Left panel */
    .stats{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff, #fafafa);
    }
    .statbox{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:#fbfdff;
    }
    .statnum{font-size:28px; font-weight:900; line-height:1.1}
    .statlbl{color:var(--muted); font-size:13px}

    .days{
      padding:10px;
      display:flex; flex-direction:column; gap:10px;
      max-height: calc(100vh - 260px);
      overflow:auto;
    }
    .day-item{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:#fff;
      cursor:pointer;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .day-item.active{
      background:#eef6ff;
      border-color:rgba(37,99,235,.28);
      outline:2px solid rgba(37,99,235,.15);
    }
    .day-left{
      display:flex; flex-direction:column; gap:2px;
      min-width:0;
    }
    .day-title{font-weight:800}
    .day-sub{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .pct-pill{
      min-width:54px;
      text-align:center;
      font-weight:900;
      padding:8px 10px;
      border-radius:999px;
      background:#0f172a;
      color:white;
      font-variant-numeric: tabular-nums;
    }

    /* Right panel */
    .detail{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .title-row h3{
      margin:0;
      font-size:18px;
      letter-spacing:.2px;
    }
    .chips{
      display:flex; flex-wrap:wrap; gap:8px;
    }
    .chip{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--chip);
      color:#111827;
      font-weight:700;
    }
    .muted{color:var(--muted)}

    .section{
      border-top:1px solid var(--line);
      padding-top:12px;
    }
    .section h4{
      margin:0 0 10px 0;
      font-size:14px;
      letter-spacing:.2px;
    }

    .items{
      display:flex; flex-direction:column; gap:10px;
    }
    .item{
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .item input[type="checkbox"]{
      margin-top:3px;
      width:18px; height:18px;
      accent-color:#2563eb;
    }
    .item .itext{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .item .main{
      font-weight:800;
    }
    .item .sub{
      color:var(--muted);
      font-size:13px;
    }

    .addline{
      margin-top:10px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .addline input{
      flex:1;
      min-width:220px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      outline:none;
    }
    .btn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#0f172a;
      color:white;
      font-weight:800;
      cursor:pointer;
    }
    .btn.secondary{
      background:#fff;
      color:#0f172a;
    }

    .note-box{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:#fbfdff;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    textarea{
      width:100%;
      min-height:80px;
      resize:vertical;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      font-family: inherit;
    }

    .footer-row{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      border-top:1px solid var(--line);
      padding-top:12px;
    }
    .bigpct{
      font-weight:900;
      font-size:18px;
      color:#0f172a;
    }

    /* colored section titles */
    .tag-study{color:var(--study)}
    .tag-meal{color:var(--meal)}
    .tag-move{color:var(--move)}
    .tag-sleep{color:var(--sleep)}
    .tag-vit{color:var(--vit)}
    .tag-work{color:var(--work)}
  </style>
</head>

<header>

    </div>

    <div class="days" id="daysList"></div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div class="detail" id="detail"></div>
  </div>
</div>

        ],
        meals:[
          {main:"Iron + protein breakfast", sub:"Eggs/beans/lentils + oats + fruit with Vitamin C (orange/kiwi) to support iron."},
          {main:"Lunch", sub:"Spinach/keerai + dal/beans + fish/chicken (light oil)."},
          {main:"Snack", sub:"Nuts + fruit (kiwi/orange) OR roasted chana."},
          {main:"Dinner", sub:"Lean protein + veg + millet/rice. Avoid tea/coffee right after iron-rich meals."}
        ],
        vit:[
          {main:"Vitamins", sub:"Iron + Vitamin D daily (set reminder)."},
          {main:"Hydration", sub:"Water through the day."}
        ],

          {main:"Walk / yoga (15–25 min)", sub:"Gentle daily movement."}
        ]

  dad: {
    name: "Dad",
    icon: "👨",
    subtitle: "Salesforce exam + Driving licence by Feb",
    chips: ["Salesforce","Driving theory","Practical"],
    days: Object.fromEntries(DATE_KEYS.map((d, idx) => [d, {
      title:"Exam + driving progress",
      routine:"Morning: Salesforce (deep work). Evening: driving theory + practice planning. Goal: Danish driving licence by Feb.",
      sections:{
        study:[
          {main:"Salesforce study (90–150 min)", sub:"Modules + hands-on + 10 practice questions."},
          {main:"Mock test / review (20–30 min)", sub:"Review wrong answers and notes."}
        ],
        work:[
          {main:"Driving theory (30–45 min)", sub:"Signs, rules, hazard perception. Use flashcards daily."},
          {main:"Driving practical planning", sub:"Book lessons / practice plan (weekly targets)."}
        ],

/* ---------------- STORAGE (keeps your updates) ---------------- */
const LS_KEY = "familyPlanner_v2";
function loadState(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveState(state){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}
const state = loadState();
/*
state structure:
state[profileId][date] = {
  checks: { sectionKey: [bool,bool,...] },
  custom: { sectionKey: [ {main,sub,doneBool} ] },
  note: "text"
}
*/

/* ---------------- UI STATE ---------------- */
let currentProfile = "kaushal";
let currentDate = DATE_KEYS[0];

/* ---------------- RENDER TABS ---------------- */
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  for(const pid of Object.keys(PROFILES)){
    const p = PROFILES[pid];
    const div = document.createElement("div");
    div.className = "tab" + (pid===currentProfile ? " active":"");
    div.innerHTML = `
      <div class="icon">${p.icon}</div>
      <div>
        <div class="tname">${p.name}</div>
        <div class="tsub">${p.subtitle}</div>
      </div>
    `;
    div.onclick = () => {
      currentProfile = pid;
      currentDate = DATE_KEYS[0];
      renderAll();
    };
    el.appendChild(div);
  }
}

/* ---------------- PERCENT CALC ---------------- */
function calcDayPct(pid, date){
  const plan = PROFILES[pid].days[date];
  const st = (((state[pid]||{})[date]) || {});
  let total = 0, done = 0;

  for(const [skey, items] of Object.entries(plan.sections)){
    total += items.length;
    const checks = (st.checks && st.checks[skey]) ? st.checks[skey] : [];
    items.forEach((_, i) => { if(checks[i]) done++; });
    // custom tasks count too
    const custom = (st.custom && st.custom[skey]) ? st.custom[skey] : [];
    total += custom.length;
    custom.forEach(t => { if(t.done) done++; });
  }
  if(total === 0) return 0;
  return Math.round((done/total)*100);
}

/* ---------------- LEFT LIST ---------------- */
function renderDays(){
  document.getElementById("rangeLabel").textContent = "Dec 22 → Jan 04";
  const list = document.getElementById("daysList");
  list.innerHTML = "";

  const pid = currentProfile;
  const p = PROFILES[pid];

  DATE_KEYS.forEach(date => {
    const meta = p.days[date];
    const pct = calcDayPct(pid, date);

    const row = document.createElement("div");
    row.className = "day-item" + (date===currentDate ? " active":"");
    row.innerHTML = `
      <div class="day-left">
        <div class="day-title">${pretty(date)}</div>
        <div class="day-sub">${meta.title}</div>
      </div>
      <div class="pct-pill">${pct}%</div>
    `;
    row.onclick = () => {
      currentDate = date;
      renderDays();
      renderDetail();
      renderHeaderStats();
    };
    list.appendChild(row);
  });
}

/* ---------------- HEADER STATS ---------------- */
function renderHeaderStats(){
  const pid = currentProfile;
  const todayISO = new Date().toISOString().slice(0,10);
  const todayInPlan = DATE_KEYS.includes(todayISO);
  const showDate = todayInPlan ? todayISO : currentDate;

  document.getElementById("todayPct").textContent = calcDayPct(pid, showDate) + "%";

  // streak: consecutive 100% days from start of plan to currentDate
  let streak = 0;
  for(const d of DATE_KEYS){
    const pct = calcDayPct(pid, d);
    if(pct === 100) streak++;
    else break;
  }
  document.getElementById("streak").textContent = String(streak);
}

/* ---------------- HELPERS (state getters/setters) ---------------- */
function ensureDayState(pid, date){
  if(!state[pid]) state[pid] = {};
  if(!state[pid][date]) state[pid][date] = { checks:{}, custom:{}, note:"" };
  if(!state[pid][date].checks) state[pid][date].checks = {};
  if(!state[pid][date].custom) state[pid][date].custom = {};
  if(typeof state[pid][date].note !== "string") state[pid][date].note = "";
  return state[pid][date];
}

/* ---------------- DETAIL (RIGHT) ---------------- */
function sectionTitle(skey){
  if(skey==="study") return `<span class="tag-study">Study Plan</span>`;
  if(skey==="meals") return `<span class="tag-meal">Meals</span>`;
  if(skey==="move") return `<span class="tag-move">Exercise • Play • Running</span>`;
  if(skey==="sleep") return `<span class="tag-sleep">Sleep</span>`;
  if(skey==="vit") return `<span class="tag-vit">Vitamins</span>`;
  if(skey==="work") return `<span class="tag-work">Driving / Work</span>`;
  return skey;
}

function renderDetail(){
  const pid = currentProfile;
  const p = PROFILES[pid];
  const date = currentDate;
  const day = p.days[date];
  const st = ensureDayState(pid, date);

  const pct = calcDayPct(pid, date);

  const chips = (p.chips||[]).map(c => `<span class="chip">${c}</span>`).join("");

  let html = `
    <div class="title-row">
      <h3>${pretty(date)} — ${day.title}</h3>
    </div>
    <div class="chips">${chips}</div>

    <div class="section">
      <h4>Visual Routine</h4>
      <div class="muted">${day.routine}</div>
    </div>
  `;

  // sections
  for(const [skey, items] of Object.entries(day.sections)){
    const checks = st.checks[skey] || [];
    html += `<div class="section">
      <h4>${sectionTitle(skey)}</h4>
      <div class="items">`;

    items.forEach((it, idx) => {
      const checked = !!checks[idx];
      html += `
        <div class="item">
          <input type="checkbox" ${checked ? "checked":""}
            onchange="toggleCheck('${pid}','${date}','${skey}',${idx}, this.checked)" />
          <div class="itext">
            <div class="main">${it.main}</div>
            <div class="sub">${it.sub || ""}</div>
          </div>
        </div>
      `;
    });

    // custom tasks in this section
    const custom = st.custom[skey] || [];
    custom.forEach((t, cidx) => {
      html += `
        <div class="item">
          <input type="checkbox" ${t.done ? "checked":""}
            onchange="toggleCustom('${pid}','${date}','${skey}',${cidx}, this.checked)" />
          <div class="itext">
            <div class="main">${escapeHtml(t.main || "Extra task")}</div>
            <div class="sub">${escapeHtml(t.sub || "")}</div>
          </div>
        </div>
      `;
    });

    html += `</div>
      <div class="addline">
        <input id="add-${skey}" placeholder="Add extra task for ${skey} (example: 'Math: practice tables')" />
        <button class="btn" onclick="addCustomTask('${pid}','${date}','${skey}')">➕ Add</button>
        <button class="btn secondary" onclick="clearSection('${pid}','${date}','${skey}')">Clear extras</button>
      </div>
    </div>`;
  }

  html += `
    <div class="note-box">
      <div style="font-weight:900;">What was done differently / Notes</div>
      <textarea id="note" placeholder="Type what actually happened today...">${escapeHtml(st.note||"")}</textarea>
      <div class="footer-row">
        <div class="bigpct">Completion: ${pct}%</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn secondary" onclick="saveNote('${pid}','${date}')">Save note</button>
          <button class="btn" onclick="resetDay('${pid}','${date}')">Reset day</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("detail").innerHTML = html;
}

/* ---------------- ACTIONS ---------------- */
function toggleCheck(pid,date,skey,idx,val){
  const st = ensureDayState(pid,date);
  if(!st.checks[skey]) st.checks[skey] = [];
  st.checks[skey][idx] = val;
  saveState(state);
  renderDays();
  renderDetail();
  renderHeaderStats();
}

function addCustomTask(pid,date,skey){
  const st = ensureDayState(pid,date);
  if(!st.custom[skey]) st.custom[skey] = [];
  const input = document.getElementById(`add-${skey}`);
  const text = (input?.value || "").trim();
  if(!text) return;

  // store as main; optional split by " - "
  let main = text, sub = "";
  if(text.includes(" - ")){
    const parts = text.split(" - ");
    main = parts.shift();
    sub = parts.join(" - ");
  }
  st.custom[skey].push({ main, sub, done:false });
  input.value = "";
  saveState(state);
  renderDays();
  renderDetail();
  renderHeaderStats();
}

function toggleCustom(pid,date,skey,cidx,val){
  const st = ensureDayState(pid,date);
  const arr = st.custom[skey] || [];
  if(arr[cidx]) arr[cidx].done = val;
  saveState(state);
  renderDays();
  renderDetail();
  renderHeaderStats();
}

function clearSection(pid,date,skey){
  const st = ensureDayState(pid,date);
  st.custom[skey] = [];
  saveState(state);
  renderDays();
  renderDetail();
  renderHeaderStats();
}

function saveNote(pid,date){
  const st = ensureDayState(pid,date);
  const note = document.getElementById("note")?.value || "";
  st.note = note;
  saveState(state);
  renderHeaderStats();
}

function resetDay(pid,date){
  if(state[pid] && state[pid][date]){
    state[pid][date] = { checks:{}, custom:{}, note:"" };
    saveState(state);
    renderDays();
    renderDetail();
    renderHeaderStats();
  }
}

/* ---------------- UTILS ---------------- */
function escapeHtml(str){
  return (str ?? "").toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ---------------- RENDER ALL ---------------- */
function renderAll(){
  renderTabs();
  renderDays();
  renderDetail();
  renderHeaderStats();
}

renderAll();
</script>
