<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Planner</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
  header { background: #222; color: white; text-align: center; padding: 15px; position: sticky; top: 0; }
  header .clock { font-size: 18px; }
  .nav { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
  .nav button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
  .schedule { display: none; padding: 0 20px 40px 20px; }
  .day { background: white; padding: 12px; margin: 10px 0; border-radius: 8px; }
  .day h3 { margin: 0 0 8px 0; }
  .task { margin: 5px 0; }
  .add-btn { margin-top: 8px; cursor: pointer; color: blue; }
  input[type="text"] { width: 85%; padding: 5px; margin: 5px 0; }
  .completion { font-weight: bold; color: darkred; }
</style>
</head>
<body>

<header>
  <h1>Family Planner</h1>
  <div class="clock" id="clock">00:00:00</div>
</header>

<div class="nav">
  <button onclick="show('kaushal')">👦 Kaushal</button>
  <button onclick="show('parnika')">👧 Parnika</button>
  <button onclick="show('Gayathri')">🤱 Gayathri</button>
  <button onclick="show('dad')">👨 Dad</button>
</div>

<!-- ================= KAUSHAL ================= -->
<div id="kaushal" class="schedule">
  <h2>Kaushal’s Tasks (Dec 22 → Jan 04)</h2>
  <div id="kaushalTasks"></div>
</div>

<!-- ================= PARNIKA ================= -->
<div id="parnika" class="schedule">
  <h2>Parnika’s Tasks (Dec 22 → Jan 04)</h2>
  <div id="parnikaTasks"></div>
</div>

<!-- ================= Gayathri ================= -->
<div id="Gayathri" class="schedule">
  <h2>Gayathri’s Tasks (Danish + Diet + Vitamins)</h2>
  <div id="GayathriTasks"></div>
</div>

<!-- ================= DAD ================= -->
<div id="dad" class="schedule">
  <h2>Dad’s Tasks (Salesforce + Driving)</h2>
  <div id="dadTasks"></div>
</div>

<script>
// -------- LIVE CLOCK --------
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// -------- SHOW SECTION --------
function show(sec) {
  document.querySelectorAll('.schedule').forEach(s => s.style.display = 'none');
  document.getElementById(sec).style.display = 'block';
}

// ======== DATA PLANS ========

const kaushalPlan = [
  {date:"Dec 22", studies:"Maths 20 min, English 15 min, Danish 15 min", food:"Protein + fruit", exercise:"Run 10 min", sleep:"8:00 pm"},
  {date:"Dec 23", studies:"Maths 20, English reading, Danish", food:"Veg + eggs", exercise:"Bike 15 min", sleep:"8:00 pm"},
  {date:"Dec 24", studies:"Maths games, English reading", food:"High protein", exercise:"Walk 20 min", sleep:"8:00 pm"},
  {date:"Dec 25", studies:"Maths fun, story reading", food:"Balanced meal", exercise:"Play", sleep:"8:00 pm"},
  {date:"Dec 26", studies:"Maths 25, Danish flashcards", food:"Protein + fruit", exercise:"Run 15", sleep:"8:00 pm"},
  {date:"Dec 27", studies:"English 20, Danish 20", food:"Veg + fruit", exercise:"Play 20 min", sleep:"8:00 pm"},
  {date:"Dec 28", studies:"Maths 30, English reading", food:"Protein snack", exercise:"Walk", sleep:"8:00 pm"},
  {date:"Dec 29", studies:"Maths + Danish cards", food:"Fruit + veg", exercise:"Run 15", sleep:"8:00 pm"},
  {date:"Dec 30", studies:"Maths problem, English story", food:"Balanced", exercise:"Play outdoors", sleep:"8:00 pm"},
  {date:"Dec 31", studies:"Math fun games", food:"Balanced", exercise:"Family walk", sleep:"8:00 pm"},
  {date:"Jan 01", studies:"Gentle reading", food:"Healthy", exercise:"Play", sleep:"8:00 pm"},
  {date:"Jan 02", studies:"Maths review, English review", food:"Protein", exercise:"Run", sleep:"8:00 pm"},
  {date:"Jan 03", studies:"Danish review", food:"Veg + fruit", exercise:"Play", sleep:"8:00 pm"},
  {date:"Jan 04", studies:"All subjects review", food:"Balanced", exercise:"Walk", sleep:"8:00 pm"},
];

const parnikaPlan = [
  {date:"Dec 22", studies:"Shapes, colours", food:"Protein + fruit", exercise:"Play 20", sleep:"8:00 pm"},
  {date:"Dec 23", studies:"Counting games", food:"Balanced meal", exercise:"Walk 15", sleep:"8:00 pm"},
  {date:"Dec 24", studies:"Alphabet play", food:"Fruit + veg", exercise:"Play", sleep:"8:00 pm"},
  {date:"Dec 25", studies:"Story reading", food:"Balanced", exercise:"Family play", sleep:"8:00 pm"},
  {date:"Dec 26", studies:"Counting & drawing", food:"Healthy", exercise:"Walk", sleep:"8:00 pm"},
  {date:"Dec 27", studies:"Happy games", food:"Veg + fruit", exercise:"Play", sleep:"8:00 pm"},
  {date:"Dec 28", studies:"Alphabet cards", food:"Protein snack", exercise:"Play outdoors", sleep:"8:00 pm"},
  {date:"Dec 29", studies:"Drawing & colours", food:"Fruit", exercise:"Run 15", sleep:"8:00 pm"},
  {date:"Dec 30", studies:"Stories", food:"Balanced meal", exercise:"Play", sleep:"8:00 pm"},
  {date:"Dec 31", studies:"Gentle games", food:"Balanced", exercise:"Family walk", sleep:"8:00 pm"},
  {date:"Jan 01", studies:"Play", food:"Healthy", exercise:"Play outdoors", sleep:"8:00 pm"},
  {date:"Jan 02", studies:"Story & shapes", food:"Protein + fruit", exercise:"Play", sleep:"8:00 pm"},
  {date:"Jan 03", studies:"Counting & music", food:"Veg + fruit", exercise:"Walk", sleep:"8:00 pm"},
  {date:"Jan 04", studies:"Games review", food:"Healthy", exercise:"Family walk", sleep:"8:00 pm"},
];

const GayathriPlan = [
  {date:"Dec 22", task:"Danish Chapter 1 study", food:"High iron breakfast + veggies + vitamin C", vitamins:"Iron + D", exercise:"Walk 20 min"},
  {date:"Dec 23", task:"Danish Chapter 2", food:"Spinach + eggs + fruit", vitamins:"Iron + D", exercise:"Yoga 15 min"},
  {date:"Dec 24", task:"Danish Chapter 3", food:"Beans + fruit + vitamin C", vitamins:"Iron + D", exercise:"Walk 20"},
  {date:"Dec 25", task:"Danish Chapter 4", food:"High protein + fruit", vitamins:"Iron + D", exercise:"Stretching"},
  {date:"Dec 26", task:"Chapter 5", food:"Veg + iron rich snacks", vitamins:"Iron + D", exercise:"Walk"},
  {date:"Dec 27", task:"Review Danish", food:"Protein + fruit", vitamins:"Iron + D", exercise:"Yoga"},
  {date:"Dec 28", task:"Practice flashcards", food:"Spinach + fruit", vitamins:"Iron + D", exercise:"Walk"},
  {date:"Dec 29", task:"Danish reading", food:"Protein + vitamin C", vitamins:"Iron + D", exercise:"Stretch"},
  {date:"Dec 30", task:"Danish quiz review", food:"Balanced iron meal", vitamins:"Iron + D", exercise:"Walk"},
  {date:"Dec 31", task:"Rest review", food:"Healthy balanced", vitamins:"Iron + D", exercise:"Relax walk"},
  {date:"Jan 01", task:"Danish apps study", food:"Veg + fruit", vitamins:"Iron + D", exercise:"Walk"},
  {date:"Jan 02", task:"Chapter recap", food:"High protein", vitamins:"Iron + D", exercise:"Yoga"},
  {date:"Jan 03", task:"Flashcards review", food:"Veg + fruit", vitamins:"Iron + D", exercise:"Walk"},
  {date:"Jan 04", task:"Full review", food:"Balanced iron meal", vitamins:"Iron + D", exercise:"Walk"},

const dadPlan = [
  {date:"Dec 22", task:"Salesforce study 2 hrs", driving:"Driving rules reading 30 min"},
  {date:"Dec 23", task:"Salesforce hands-on 2 hrs", driving:"Driving simulator 30"},

  {date:"Dec 31", task:"Salesforce rest review", driving:"Light overview"},
  {date:"Jan 01", task:"Salesforce recap", driving:"Rules flashcards"},
  {date:"Jan 02", task:"Salesforce practice", driving:"Sim 30"},
  {date:"Jan 03", task:"Salesforce mock", driving:"Rules review"},
  {date:"Jan 04", task:"Final Salesforce prep", driving:"Driving plan"},
];

// ======== RENDER ========
function renderSchedule(plans, containerId, type) {
  let html = "";
  plans.forEach(day => {
    html += `<div class="day">
      <h3>${day.date}</h3>`;
    if(type === "kid") {
      html += `<div class="task">📘 Studies: ${day.studies}</div>`;
      html += `<div class="task">🍎 Food: ${day.food}</div>`;
      html += `<div class="task">🏃 Exercise: ${day.exercise}</div>`;
      html += `<div class="task">😴 Sleep: ${day.sleep}</div>`;
    } else if(type === "Gayathri") {
      html += `<div class="task">📘 Task: ${day.task}</div>`;
      html += `<div class="task">🍎 Food: ${day.food}</div>`;
      html += `<div class="task">💊 Vitamins: ${day.vitamins}</div>`;
      html += `<div class="task">🏃 Exercise: ${day.exercise}</div>`;
    } else if(type === "dad") {
      html += `<div class="task">📘 ${day.task}</div>`;
      html += `<div class="task">🚗 Driving: ${day.driving}</div>`;
    }

    html += `
      <div>
        <label>What was done differently?</label><br>
        <input type="text" placeholder="Type here...">
      </div>
      <div class="completion">Completion %:<input type="text" placeholder="Enter %"></div>
      <div class="add-btn" onclick="addTask(this)">➕ Add task</div>
    </div>`;
  });

  document.getElementById(containerId).innerHTML = html;
}

renderSchedule(kaushalPlan, "kaushalTasks", "kid");
renderSchedule(parnikaPlan, "parnikaTasks", "kid");
renderSchedule(GayathriPlan, "GayathriTasks", "Gayathri");
renderSchedule(dadPlan, "dadTasks", "dad");

// ======== ADD EXTRA TASK ========
function addTask(el) {
  const div = document.createElement("div");
  div.className = "day";
  div.innerHTML = `
    <label>New Extra Task:</label><br>
    <input type="text" placeholder="Enter new task">
  `;
  el.parentElement.parentElement.insertBefore(div, el.parentElement.nextSibling);
}

// ====== INIT ======
show("kaushal");
</script>

</body>
</html>
