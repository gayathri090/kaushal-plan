<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Routine Tracker (Dec 21 – Jan 04)</title>

<style>
body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f5f6fb; }
.page { display:none; }
.page.active { display:block; }
.wrap { max-width:1100px; margin:auto; padding:14px; }

.topbar { position:sticky; top:0; background:#0f172a; z-index:10; }
.nav { display:flex; gap:12px; padding:12px; flex-wrap:wrap; }
.navbtn {
  background:#1f2937; color:#fff; border:none; border-radius:16px;
  padding:10px 14px; display:flex; gap:10px; align-items:center;
  cursor:pointer;
}
.navbtn.active { background:#22c55e; }
.icon { font-size:28px; background:#ffffff22; width:48px; height:48px; display:grid; place-items:center; border-radius:14px; }

header { background:#111827; color:#fff; border-radius:16px; padding:16px; margin-bottom:14px; }
header h1 { margin:0; font-size:18px; }
header p { margin:6px 0 0; font-size:13px; opacity:.9; }

.grid { display:grid; grid-template-columns:320px 1fr; gap:14px; }
@media(max-width:900px){ .grid{ grid-template-columns:1fr; } }

.card {
  background:#fff; border-radius:14px; border:1px solid #e5e7eb;
  box-shadow:0 1px 6px rgba(0,0,0,.05);
}
.card h2 { margin:0; padding:12px 14px; border-bottom:1px solid #e5e7eb; font-size:15px; }
.card .content { padding:12px 14px; }

.dayBtn {
  width:100%; text-align:left; padding:10px; border-radius:12px;
  border:1px solid #e5e7eb; background:#fafafa; margin-bottom:8px;
  cursor:pointer;
}
.dayBtn.active { background:#e0f2fe; border-color:#38bdf8; }

label { display:flex; gap:10px; padding:8px; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:8px; }
label.done { opacity:.6; background:#f3f4f6; }

textarea { width:100%; min-height:80px; border-radius:10px; border:1px solid #e5e7eb; padding:8px; }
.small { font-size:12px; color:#6b7280; }
.badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#e5e7eb; margin-right:6px; }
</style>
</head>

<body>

<div class="topbar">
  <div class="nav">
    <button class="navbtn active" onclick="showPage('kaushal',this)">
      <div class="icon">👦</div> Kaushal
    </button>
    <button class="navbtn" onclick="showPage('parnika',this)">
      <div class="icon">👧</div> Parnika
    </button>
    <button class="navbtn" onclick="showPage('mom',this)">
      <div class="icon">👩</div> Mom
    </button>
    <button class="navbtn" onclick="showPage('dad',this)">
      <div class="icon">👨</div> Dad
    </button>
  </div>
</div>

<div class="wrap">

<!-- ================= KAUSHAL ================= -->
<section id="kaushal" class="page active">
<header>
<h1>Kaushal – Holiday Plan</h1>
<p>Dec 21, 2025 → Jan 04, 2026 • Autism-friendly • Short focused blocks</p>
</header>

<div class="grid">
<div class="card">
<h2>Days</h2>
<div class="content" id="daysK"></div>
</div>

<div class="card">
<h2 id="titleK"></h2>
<div class="content">
<div id="listK"></div>
<h3>Notes</h3>
<textarea id="notesK"></textarea>
</div>
</div>
</div>
</section>

<!-- ================= PARNIKA ================= -->
<section id="parnika" class="page">
<header>
<h1>Parnika (Age 3.9) – Holiday Plan</h1>
<p>Dec 21, 2025 → Jan 04, 2026 • Play-based • Online school 4:30–7:30 PM</p>
</header>

<div class="grid">
<div class="card">
<h2>Days</h2>
<div class="content" id="daysP"></div>
</div>

<div class="card">
<h2 id="titleP"></h2>
<div class="content">
<div id="listP"></div>
<h3>Notes</h3>
<textarea id="notesP"></textarea>
</div>
</div>
</div>
</section>

<section id="mom" class="page">
<header><h1>Mom</h1><p>Coming soon</p></header>
</section>

<section id="dad" class="page">
<header><h1>Dad</h1><p>Coming soon</p></header>
</section>

</div>

<script>
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function fmt(d){ return new Date(d).toDateString(); }

const dates = [
"2025-12-21","2025-12-22","2025-12-23","2025-12-24","2025-12-25",
"2025-12-26","2025-12-27","2025-12-28","2025-12-29","2025-12-30",
"2025-12-31","2026-01-01","2026-01-02","2026-01-03","2026-01-04"
];

function build(child){
  const daysDiv = document.getElementById("days"+child);
  const title = document.getElementById("title"+child);
  const list = document.getElementById("list"+child);
  const notes = document.getElementById("notes"+child);
  const key = "plan_"+child;

  let state = JSON.parse(localStorage.getItem(key) || "{}");
  let idx = state.idx || 0;

  function save(){ localStorage.setItem(key, JSON.stringify(state)); }

  function render(){
    daysDiv.innerHTML="";
    dates.forEach((d,i)=>{
      const b=document.createElement("button");
      b.className="dayBtn"+(i===idx?" active":"");
      b.textContent=fmt(d);
      b.onclick=()=>{ idx=i; state.idx=i; save(); render(); };
      daysDiv.appendChild(b);
    });

    const date=dates[idx];
    title.textContent=fmt(date);

    state[date]=state[date]||{};
    list.innerHTML="";
    ["Study / Play","Exercise","Healthy Meals","Sleep on time"].forEach(t=>{
      const id=date+t;
      const l=document.createElement("label");
      if(state[date][id]) l.classList.add("done");
      const c=document.createElement("input");
      c.type="checkbox"; c.checked=!!state[date][id];
      c.onchange=()=>{ state[date][id]=c.checked; save(); render(); };
      l.append(c,document.createTextNode(t));
      list.appendChild(l);
    });

    notes.value=state[date].notes||"";
    notes.oninput=()=>{ state[date].notes=notes.value; save(); };
  }
  render();
}

build("K");
build("P");
</script>

</body>
</html>
