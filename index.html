<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Plan — Kaushal • Parnika • Mom • Dad</title>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --accent:#2563eb;

      --study:#e0f2fe;
      --food:#dcfce7;
      --exercise:#f3e8ff;
      --sleep:#ffedd5;
      --admin:#fef9c3;
      --exam:#ffe4e6;

      --shadow: 0 10px 25px rgba(15,23,42,.08);
      --radius: 16px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg);
      color:var(--text);
    }

    /* Top bar */
    header{
      position: sticky;
      top:0;
      z-index: 50;
      background: rgba(245,247,251,.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar{
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .brand .title{
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    .brand .subtitle{
      font-size: 12px;
      color: var(--muted);
    }
    .clock{
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(15,23,42,.06);
      min-width: 120px;
      text-align:center;
    }

    /* Tabs */
    .tabs{
      max-width:1200px;
      margin: 0 auto;
      padding: 0 16px 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .tab{
      border: 1px solid var(--line);
      background:#fff;
      padding:10px 12px;
      border-radius: 12px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow: 0 6px 18px rgba(15,23,42,.05);
      user-select:none;
      font-weight: 700;
      color: #1f2937;
    }
    .tab .bigIcon{
      font-size: 20px;
      line-height: 1;
    }
    .tab.active{
      border-color: rgba(37,99,235,.35);
      outline: 3px solid rgba(37,99,235,.12);
      color: var(--accent);
    }

    /* Layout */
    .wrap{
      max-width:1200px;
      margin: 18px auto 48px;
      padding: 0 16px;
      display:grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
    }
    @media (max-width: 980px){
      .wrap{
        grid-template-columns: 1fr;
      }
    }

    /* Left panel */
    .leftCard{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .leftHead{
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .leftHead h3{
      margin:0;
      font-size: 16px;
      font-weight: 900;
    }
    .stats{
      padding: 12px 14px 6px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .statBox{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fbfdff;
    }
    .statValue{
      font-size: 24px;
      font-weight: 900;
      line-height: 1.1;
    }
    .statLabel{
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .dayList{
      padding: 10px 10px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .dayBtn{
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      box-shadow: 0 6px 14px rgba(15,23,42,.05);
    }
    .dayBtn.active{
      background: #eef2ff;
      border-color: rgba(37,99,235,.25);
      outline: 3px solid rgba(37,99,235,.10);
    }
    .dayMeta{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .dayDate{
      font-weight: 900;
      font-size: 14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .dayTagline{
      font-size: 12px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .badge{
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid var(--line);
      background:#0f172a;
      color:#fff;
      min-width: 54px;
      text-align:center;
    }

    /* Right panel */
    .rightCard{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .rightHead{
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .rightTitle{
      margin:0;
      font-size: 18px;
      font-weight: 950;
      line-height: 1.2;
    }
    .rightSub{
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .pillRow{
      padding: 12px 18px 2px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .pill{
      border: 1px solid var(--line);
      background:#fff;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 800;
      font-size: 12px;
      color: #111827;
    }

    .content{
      padding: 14px 18px 20px;
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .sectionTitle{
      font-size: 14px;
      font-weight: 950;
      margin: 0 0 8px;
    }
    .hint{
      font-size: 13px;
      color: var(--muted);
      margin: -2px 0 0;
    }

    .box{
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 12px;
      background: #fff;
    }
    .box.study{ background: var(--study); }
    .box.food{ background: var(--food); }
    .box.exercise{ background: var(--exercise); }
    .box.sleep{ background: var(--sleep); }
    .box.admin{ background: var(--admin); }
    .box.exam{ background: var(--exam); }

    .taskRow{
      display:flex;
      gap:10px;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,.35);
      background: rgba(255,255,255,.75);
      align-items:flex-start;
      margin-top: 10px;
    }
    .taskRow:first-of-type{ margin-top: 0; }
    .taskRow label{
      display:flex;
      gap:10px;
      width:100%;
      cursor:pointer;
    }
    .taskText{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .taskMain{
      font-weight: 900;
      font-size: 14px;
    }
    .taskSmall{
      font-size: 13px;
      color: #475569;
      line-height: 1.35;
    }
    input[type="checkbox"]{
      width:18px;
      height:18px;
      margin-top:2px;
      accent-color: var(--accent);
      flex:0 0 auto;
    }

    .notesArea{
      width:100%;
      min-height: 84px;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px;
      font-size: 13px;
      outline:none;
      resize: vertical;
    }

    .footerRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content: space-between;
      padding-top: 6px;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff;
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(15,23,42,.05);
      user-select:none;
    }
    .btn.primary{
      background: var(--accent);
      color: #fff;
      border-color: rgba(37,99,235,.45);
    }
    .btn.danger{
      background: #ef4444;
      color:#fff;
      border-color: rgba(239,68,68,.45);
    }

    .smallMuted{ font-size: 12px; color: var(--muted); }
  </style>
</head>

/* ---------------------------
   LIVE CLOCK
---------------------------- */
function updateClock(){
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

/* ---------------------------
   HELPERS
---------------------------- */
function isoDateKey(d){
  // d is "2025-12-22"
  return d;
}
function fmtDayLabel(d){
  const dt = new Date(d + "T00:00:00");
  const opts = { weekday:"short", month:"short", day:"numeric", year:"numeric" };
  return dt.toLocaleDateString(undefined, opts);
}
function safeParse(json, fallback){
  try { return JSON.parse(json); } catch { return fallback; }
}
function lsKey(personId, dateKey){
  return `familyplan.v1.${personId}.${dateKey}`;

function makeDays(base){

function chapterForIndex(i){
  // simple rotation of 6 chapters
  const ch = [
    "Chapter 1 — Denmark’s history",
    "Chapter 2 — Danish democracy",
    "Chapter 3 — Danish economy",
    "Chapter 4 — Denmark & the world",
    "Chapter 5 — Danish culture",
    "Chapter 6 — Themes (values, daily life, equality)"
  ];
  return ch[i % ch.length];
}

/* ---------------------------
   STATE
---------------------------- */
let currentPersonId = "kaushal";
let currentDateKey = DATE_KEYS[0];

/* ---------------------------
   UI RENDER
---------------------------- */
function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  Object.entries(PLANS).forEach(([id, p]) => {
    const btn = document.createElement("div");
    btn.className = "tab" + (id === currentPersonId ? " active" : "");
    btn.innerHTML = `<span class="bigIcon">${p.icon}</span><span>${p.label}</span>`;
    btn.onclick = () => {
      currentPersonId = id;
      currentDateKey = DATE_KEYS[0];
      renderAll();
    };
    tabs.appendChild(btn);
  });
}

function loadDayState(personId, dateKey){
  const raw = localStorage.getItem(lsKey(personId, dateKey));
  const state = safeParse(raw, null);
  if(state) return state;
  return { checks:{}, notes:"", extraTasks:[] };
}

function saveDayState(personId, dateKey, state){
  localStorage.setItem(lsKey(personId, dateKey), JSON.stringify(state));
}

function calcCompletion(planDay, state){
  // planned tasks count
  let planned = 0;
  let done = 0;

  // planned tasks from sections
  planDay.sections.forEach((sec, si) => {
    (sec.tasks || []).forEach((t, ti) => {
      planned++;
      const key = `p:${si}:${ti}`;
      if(state.checks[key]) done++;
    });
  });

  // extra tasks
  (state.extraTasks || []).forEach((t, i) => {
    planned++;
    const key = `x:${i}`;
    if(state.checks[key]) done++;
  });

  if(planned === 0) return 0;
  return Math.round((done / planned) * 100);
}

function renderLeft(){
  const person = PLANS[currentPersonId];
  document.getElementById("leftTitle").textContent = "Days";

  const list = document.getElementById("dayList");
  list.innerHTML = "";

  person.days.forEach((day) => {
    const state = loadDayState(currentPersonId, day.dateKey);
    const pct = calcCompletion(day, state);

    const btn = document.createElement("div");
    btn.className = "dayBtn" + (day.dateKey === currentDateKey ? " active" : "");
    btn.innerHTML = `
      <div class="dayMeta">
        <div class="dayDate">${fmtDayLabel(day.dateKey)}</div>
        <div class="dayTagline">${day.title} • ${day.tagline}</div>
      </div>
      <div class="badge">${pct}%</div>
    `;
    btn.onclick = () => { currentDateKey = day.dateKey; renderRight(); renderLeftStats(); renderLeft(); };
    list.appendChild(btn);
  });

  renderLeftStats();
}

function renderLeftStats(){
  const person = PLANS[currentPersonId];
  // "Today completion" — use selected day (simple & predictable)
  const day = person.days.find(x => x.dateKey === currentDateKey) || person.days[0];
  const state = loadDayState(currentPersonId, day.dateKey);
  const pct = calcCompletion(day, state);
  document.getElementById("todayPct").textContent = `${pct}%`;

  // "Streak" — count consecutive days from start where completion > 0
  let streak = 0;
  for(const d of person.days){
    const st = loadDayState(currentPersonId, d.dateKey);
    const p = calcCompletion(d, st);
    if(p > 0) streak++;
    else break;
  }
  document.getElementById("streak").textContent = `${streak}`;
}

function renderRight(){
  const person = PLANS[currentPersonId];
  const day = person.days.find(x => x.dateKey === currentDateKey) || person.days[0];
  const state = loadDayState(currentPersonId, day.dateKey);

  document.getElementById("dayTitle").textContent = `${fmtDayLabel(day.dateKey)} — ${day.title} • ${day.tagline}`;
  document.getElementById("daySubtitle").textContent = day.routine || "";

  // pills: combine person.headerPills + day.pills
  const pillRow = document.getElementById("pillRow");
  pillRow.innerHTML = "";
  const pills = [...(person.headerPills || []), ...(day.pills || [])];
  pills.forEach(p => {
    const el = document.createElement("div");
    el.className = "pill";
    el.textContent = p;
    pillRow.appendChild(el);
  });

  // content
  const content = document.getElementById("dayContent");
  content.innerHTML = "";

  // sections
  day.sections.forEach((sec, si) => {
    const box = document.createElement("div");
    const typeClass = sec.type || "study";
    box.className = `box ${typeClass}`;
    box.innerHTML = `
      <div class="sectionTitle">${sec.title || "Section"}</div>
      ${sec.hint ? `<div class="hint">${sec.hint}</div>` : ""}
    `;

    (sec.tasks || []).forEach((task, ti) => {
      const key = `p:${si}:${ti}`;
      const row = document.createElement("div");
      row.className = "taskRow";
      row.innerHTML = `
        <label>
          <input type="checkbox" ${state.checks[key] ? "checked" : ""} />
          <div class="taskText">
            <div class="taskMain">${task.t}</div>
            <div class="taskSmall">${task.d || ""}</div>
          </div>
        </label>
      `;
      row.querySelector("input").addEventListener("change", (e) => {
        state.checks[key] = e.target.checked;
        saveDayState(currentPersonId, day.dateKey, state);
        updateRightPct(day, state);
        renderLeft(); // update badges
      });
      box.appendChild(row);
    });

    content.appendChild(box);
  });

  // Extra tasks section
  const extraBox = document.createElement("div");
  extraBox.className = "box";
  extraBox.innerHTML = `
    <div class="sectionTitle">Extra tasks (your additions)</div>
    <div class="smallMuted">Add anything that happened differently or new tasks you want for this day.</div>
  `;

  const extraWrap = document.createElement("div");
  extraWrap.id = "extraWrap";
  extraWrap.style.marginTop = "10px";
  extraBox.appendChild(extraWrap);

  function renderExtra(){
    extraWrap.innerHTML = "";
    (state.extraTasks || []).forEach((t, i) => {
      const key = `x:${i}`;
      const row = document.createElement("div");
      row.className = "taskRow";
      row.innerHTML = `
        <label>
          <input type="checkbox" ${state.checks[key] ? "checked" : ""} />
          <div class="taskText">
            <div class="taskMain">${escapeHtml(t)}</div>
            <div class="taskSmall">Added by you</div>
          </div>
        </label>
        <button class="btn danger" style="padding:8px 10px; margin-left:auto;" title="Remove">✕</button>
      `;
      row.querySelector("input").addEventListener("change",(e)=>{
        state.checks[key] = e.target.checked;
        saveDayState(currentPersonId, day.dateKey, state);
        updateRightPct(day, state);
        renderLeft();
      });
      row.querySelector("button").addEventListener("click",()=>{
        // remove
        state.extraTasks.splice(i,1);
        // rebuild checks for extras
        const newChecks = {};
        Object.entries(state.checks).forEach(([k,v])=>{
          if(!k.startsWith("x:")) newChecks[k]=v;
        });
        state.checks = newChecks;
        saveDayState(currentPersonId, day.dateKey, state);
        renderRight();
        renderLeft();
      });
      extraWrap.appendChild(row);
    });
  }
  renderExtra();

  // Notes
  const notesBox = document.createElement("div");
  notesBox.className = "box";
  notesBox.innerHTML = `
    <div class="sectionTitle">Notes / What was done differently today</div>
    <textarea class="notesArea" id="notesArea" placeholder="Example: He skipped writing today but did 20 min extra running.">${state.notes || ""}</textarea>
    <div class="footerRow">
      <div class="smallMuted">Auto-saves. Completion updates based on checkboxes.</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" id="addTaskBtn">➕ Add a new task</button>
        <button class="btn" id="clearDayBtn">Reset this day</button>
      </div>
    </div>
  `;
  content.appendChild(extraBox);
  content.appendChild(notesBox);

  // Add task handler
  notesBox.querySelector("#addTaskBtn").addEventListener("click",()=>{
    const text = prompt("Enter the new task:");
    if(!text || !text.trim()) return;
    state.extraTasks.push(text.trim());
    saveDayState(currentPersonId, day.dateKey, state);
    renderRight();
    renderLeft();
  });

  // Reset day
  notesBox.querySelector("#clearDayBtn").addEventListener("click",()=>{
    const ok = confirm("Reset this day’s checkboxes, notes, and extra tasks?");
    if(!ok) return;
    localStorage.removeItem(lsKey(currentPersonId, day.dateKey));
    renderRight();
    renderLeft();
  });

  // Notes autosave
  notesBox.querySelector("#notesArea").addEventListener("input",(e)=>{
    state.notes = e.target.value;
    saveDayState(currentPersonId, day.dateKey, state);
  });

  updateRightPct(day, state);
}

function updateRightPct(day, state){
  const pct = calcCompletion(day, state);
  document.getElementById("dayPct").textContent = `${pct}%`;
  renderLeftStats();
}

function renderAll(){
  renderTabs();
  renderLeft();
  renderRight();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ---------------------------
   INIT
---------------------------- */
renderAll();
</script>
</body>
</html>
